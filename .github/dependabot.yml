version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "rudderlabs/*"
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
      pip:
        patterns:
          - "*"
